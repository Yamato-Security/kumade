name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'art/**'
      - 'artifacts/**'
      - 'src/live_info/datasets.json'
      - 'src/main.rs'
      - 'Cargo.toml'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - 'art/**'
      - 'artifacts/**'
      - 'src/live_info/datasets.json'
      - 'src/main.rs'
      - 'Cargo.toml'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r website/requirements.txt
      - name: Check reference coverage
        run: python website/scripts/check_reference.py
      - name: Build strictly
        run: python -m mkdocs build --strict --config-file website/mkdocs.yml
      - name: Check generated links and assets
        run: python website/scripts/check_site.py website/site
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kumade-docs-preview
          path: website/site
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
