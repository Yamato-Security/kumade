name: Release packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit, branch or tag to build (blank uses the workflow commit)'
        required: false
        type: string

      bundle_rules:
        description: 'Also build offline Core/Extended/Full YARA Forge variants'
        required: true
        default: true
        type: boolean
      yara_forge_release:
        description: 'YARA Forge date tag or latest (resolved once for all platforms)'
        default: 'latest'
        type: string

# Building never publishes a release or receives a write token. Packages are
# reviewed before attachment to the release page.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Also applies when building older release tags without an i686 target config.
  CARGO_TARGET_I686_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'

jobs:
  forge:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve one immutable Forge release
        id: resolve
        env:
          FORGE_RELEASE: ${{ inputs.yara_forge_release }}
          BUNDLE_RULES: ${{ inputs.bundle_rules }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$BUNDLE_RULES" != true ]]; then exit 0; fi
          requested="${FORGE_RELEASE:-latest}"
          if [[ "$requested" != latest && ! "$requested" =~ ^[0-9]{8}$ ]]; then exit 1; fi
          endpoint=latest
          if [[ "$requested" != latest ]]; then endpoint="tags/$requested"; fi
          tag=$(gh api "repos/YARAHQ/yara-forge/releases/$endpoint" --jq .tag_name)
          if [[ ! "$tag" =~ ^[0-9]{8}$ ]]; then exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: forge
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: i686-pc-windows-msvc, platform: win-x86, native: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win-x64, native: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, platform: win-aarch64, native: false }
    steps:
      # Use the current packaging contract even when compiling an older tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve release packager
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/yara-release-codex"
          cp scripts/package_release.py "$RUNNER_TEMP/kumade-package-release.py"
          cp scripts/package_release.py scripts/prepare_yara_bundle.py scripts/build_yara_packages.py "$RUNNER_TEMP/yara-release-codex/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - name: Check version against release tag
        shell: bash
        run: |
          git rev-parse HEAD
          version=$(cargo metadata --locked --format-version 1 --no-deps | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "kumade"))')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi
      - name: Run tests on executable targets
        if: matrix.native
        run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $imports = & $dumpbin.FullName /nologo /dependents "target/$env:BUILD_TARGET/release/kumade.exe" |
            ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' }
          if (-not $imports) { throw 'No DLL imports found' }
          $runtime = $imports | Where-Object { $_ -match '^(vcruntime|msvcp|msvcr|ucrtbase|api-ms-win-crt-)' }
          if ($runtime) { throw "Unexpected C runtime DLL dependency: $runtime" }
          Write-Host "Windows system DLLs: $($imports -join ', ')"
      - name: Smoke test
        if: matrix.native
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          extension=''
          if [[ "$RUNNER_OS" == Windows ]]; then extension='.exe'; fi
          binary="$GITHUB_WORKSPACE/target/$BUILD_TARGET/release/kumade$extension"
          "$binary" --version
          "$binary" doctor --check
          "$binary" list --builtin
      - name: Package ZIP and standalone executable
        shell: bash
        run: python3 "$RUNNER_TEMP/kumade-package-release.py" --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - name: Build and package offline YARA Forge variants
        if: inputs.bundle_rules
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          FORGE_TAG: ${{ needs.forge.outputs.tag }}
          NATIVE_TESTS: ${{ matrix.native }}
        run: |
          extra=()
          if [[ "$NATIVE_TESTS" == true ]]; then extra+=(--native-tests); fi
          python3 "$RUNNER_TEMP/yara-release-codex/build_yara_packages.py" --target "$BUILD_TARGET" --platform "$BUILD_PLATFORM" --release "$FORGE_TAG" --work-directory "$RUNNER_TEMP/yara-bundles-codex" "${extra[@]}"
      - name: Verify download layout
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          output = pathlib.Path('dist')
          archives = list(output.glob('kumade-*.zip'))
          executables = list(output.glob('*.exe'))
          assert len(archives) == len(executables) and len(archives) in (1, 4)
          for path in archives:
              executable = path.with_suffix('.exe')
              with zipfile.ZipFile(path) as archive:
                  assert archive.namelist() == [executable.name], 'ZIP must contain only the executable'
                  assert archive.testzip() is None
                  assert hashlib.sha256(archive.read(executable.name)).digest() == hashlib.sha256(executable.read_bytes()).digest()
          assert (output / 'LICENSES.txt').is_file()
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        working-directory: dist
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          files = sorted(p for p in pathlib.Path('.').iterdir() if p.is_file() and p.name != 'SHA256SUMS.txt')
          pathlib.Path('SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 30
