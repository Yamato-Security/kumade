name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sftp:
    name: Test (upload-only OpenSSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - run: sudo apt-get update && sudo apt-get install -y openssh-server acl
      - run: python3 scripts/test_yara_bundle_tools.py
      - run: cargo test --locked --all-targets
      - run: python3 scripts/test_sftp_restore.py
      - run: cargo build --locked
      - run: python3 scripts/test_sftp_receiver.py --binary target/debug/kumade
      - run: python3 scripts/test_sftp_resume.py --binary target/debug/kumade
      # An isolated localhost sshd and random account, removed by the test.
      # Does not edit or reload the runner's system sshd configuration.
      - run: sudo python3 scripts/test_sftp_openssh.py --binary target/debug/kumade
      - run: sudo python3 scripts/test_sftp_expiry.py

  windows-x86:
    name: Test (Windows x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          components: clippy
          targets: i686-pc-windows-msvc
      - run: cargo clippy --locked --all-targets --target i686-pc-windows-msvc -- -D warnings
      # The x64 Windows runner can execute x86 binaries through WOW64.
      - name: Acquisition ordering regressions
        run: cargo test --locked --test ordering --target i686-pc-windows-msvc
      - name: Built-in receiver and native readback (x86)
        run: python scripts/test_sftp_receiver.py --binary target/i686-pc-windows-msvc/debug/kumade.exe
      - run: cargo test --locked --all-targets --target i686-pc-windows-msvc
      - name: NTFS VHDX round trip (x86 collector)
        shell: pwsh
        run: ./scripts/test_vhdx.ps1 -Binary ./target/i686-pc-windows-msvc/debug/kumade.exe -WorkDirectory "$env:RUNNER_TEMP/kumade-vhdx-roundtrip"

  windows-x64:
    name: Test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: aarch64-pc-windows-msvc
      - run: cargo clippy --locked --all-targets --target aarch64-pc-windows-msvc -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Acquisition ordering regressions
        run: cargo test --locked --test ordering
      - name: Built-in receiver and native readback (x64)
        run: python scripts/test_sftp_receiver.py --binary target/debug/kumade.exe
      - name: Concurrent SFTP collectors and interrupted transfer (x64)
        run: python scripts/test_sftp_resume.py --binary target/debug/kumade.exe
      - name: Isolated VSS acquisition
        run: cargo test --locked --test vss_windows
      - name: Remaining regression tests
        run: cargo test --locked --all-targets -- --skip locked_file_snapshot_content_raw_ntfs_cleanup_and_cli_backends
      - name: NTFS VHDX round trip
        shell: pwsh
        run: ./scripts/test_vhdx.ps1 -Binary ./target/debug/kumade.exe -WorkDirectory "$env:RUNNER_TEMP/kumade-vhdx-roundtrip"
