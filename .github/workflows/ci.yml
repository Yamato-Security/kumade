name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-x86:
    name: Test (Windows x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          components: clippy
          targets: i686-pc-windows-msvc
      - run: cargo clippy --locked --all-targets --target i686-pc-windows-msvc -- -D warnings
      # The x64 Windows runner can execute x86 binaries through WOW64.
      - run: cargo test --locked --all-targets --target i686-pc-windows-msvc
      - name: NTFS VHDX round trip (x86 collector)
        shell: pwsh
        run: ./scripts/test_vhdx.ps1 -Binary ./target/i686-pc-windows-msvc/debug/kumade.exe -WorkDirectory "$env:RUNNER_TEMP/kumade-vhdx-roundtrip"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Independent E01 validation prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libewf2
          echo "KUMADE_EWFVERIFY=$GITHUB_WORKSPACE/scripts/verify_e01_libewf.py" >> "$GITHUB_ENV"
      - run: cargo test --locked --all-targets
      - name: NTFS VHDX round trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_vhdx.ps1 -Binary ./target/debug/kumade.exe -WorkDirectory "$env:RUNNER_TEMP/kumade-vhdx-roundtrip"
