[package]
name = "kumade"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "RPL-1.5"
authors = ["Yamato Security"]
description = "Windows forensic evidence collector by Yamato Security"
repository = "https://github.com/Yamato-Security/kumade"
readme = "README.md"

[features]
default = []
bundled-yara-core = []
bundled-yara-extended = []
bundled-yara-full = []

[build-dependencies]
cc = "1"
sha2 = "0.11"

[dependencies]
anyhow = "1.0"
aws-sdk-s3 = { version = "1.162", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5", default-features = false, features = ["rustls-ring"] }
url = "2.5"
tokio-util = { version = "0.7", features = ["io-util"] }
base64 = "0.22"
boreal = { version = "=1.4.0", default-features = false, features = ["hash", "object", "authenticode"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
csv = "1.4"
fs2 = "0.4"
globset = "0.4"
# Newer releases changed narrow-terminal rendering; keep the known working
# version until our long-path/terminal-width checks qualify an upgrade.
indicatif = "=0.18.4"
ntfs = "0.4"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.11"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"
# Native EWF1 encoding/verification of the staged NTFS disk.
# Cargo.lock pins the reviewed revisions; neither needs an installed runtime.
# Switch to main after the EWF1 continuation-marker fix is merged.
ewf-image = { package = "ys-e01-parser", git = "https://github.com/Yamato-Security/ys-e01-parser", branch = "main", features = ["writer", "parallel"] }
tempfile = "3"
russh = { version = "0.65.4", default-features = false, features = ["ring"] }
russh-sftp = "4.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "macros", "signal"] }
rpassword = { version = "7", default-features = false }
zeroize = { version = "1", features = ["alloc"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
rand = "0.10"
subtle = "2.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Globalization", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography",
  "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_Storage_Vhd",
  "Wdk_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry",
  "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_Environment", "Win32_System_Memory",
  "Win32_System_WindowsProgramming", "Win32_System_SystemServices"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
