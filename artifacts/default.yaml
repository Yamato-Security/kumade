SchemaVersion: 1
Artifacts:
  - Id: windows.eventlogs
    Name: Windows event logs and archives
    Category: EventLogs
    Patterns: ['Windows/System32/winevt/Logs/**', 'Windows/System32/config/*.evt']
  - Id: windows.registry.system
    Name: System registry hives and recovery files
    Category: Registry
    Patterns: ['Windows/System32/config/**']
  - Id: windows.registry.profiles
    Name: All discovered user and service registry hives
    Category: Registry
    ProfilePatterns: ['NTUSER.DAT*', 'ntuser.dat*', 'AppData/Local/Microsoft/Windows/UsrClass.dat*']
  - Id: windows.amcache
    Name: Amcache stores and recovery files
    Category: FileExistence
    Patterns: ['Windows/AppCompat/Programs/**']
  - Id: windows.ntfs.mft
    Name: NTFS master file table
    Category: FileSystem
    Patterns: ['$MFT']
    RawPaths: ['$MFT']
  - Id: windows.ntfs.logfile
    Name: NTFS transaction log
    Category: FileSystem
    Patterns: ['$LogFile']
    RawPaths: ['$LogFile']
  - Id: windows.ntfs.usn
    Name: USN journal and control metadata
    Category: FileSystem
    Patterns: ['$J', '$Max', '$Extend/$UsnJrnl/**']
    RawPaths: ['$Extend/$UsnJrnl:$J', '$Extend/$UsnJrnl:$Max']
  - Id: windows.ntfs.security
    Name: NTFS security descriptor stream
    Category: FileSystem
    Patterns: ['$SDS', '$Secure/**']
    RawPaths: ['$Secure:$SDS']
  - Id: windows.ntfs.volume
    Name: NTFS boot and allocation metadata
    Category: FileSystem
    Patterns: ['$Boot', '$Bitmap', '$Volume']
    RawPaths: ['$Boot', '$Bitmap']
  - Id: windows.prefetch
    Name: Prefetch files and supporting metadata
    Category: ProcessExecution
    Patterns: ['Windows/Prefetch/**']
  - Id: windows.pca
    Name: Program compatibility assistant files
    Category: ProcessExecution
    Patterns: ['Windows/AppCompat/PCA/**']
  - Id: windows.recent
    Name: Recent shortcuts and Jump Lists
    Category: FileAndFolderOpening
    ProfilePatterns: ['AppData/Roaming/Microsoft/Windows/Recent/**', 'Recent/**']
  - Id: windows.shellcache
    Name: Thumbnail and icon cache
    Category: FileAndFolderOpening
    ProfilePatterns: ['AppData/Local/Microsoft/Windows/Explorer/**', 'AppData/Local/IconCache.db']
  - Id: windows.activities
    Name: ActivitiesCache and companion files
    Category: ProcessExecution
    ProfilePatterns: ['AppData/Local/ConnectedDevicesPlatform/**']
  - Id: windows.srum
    Name: Complete SRUM database family
    Category: Network
    Patterns: ['Windows/System32/sru/**']
  - Id: windows.sum
    Name: System usage metrics database family
    Category: Accounts
    Patterns: ['Windows/System32/LogFiles/SUM/**']
  - Id: windows.bits
    Name: BITS queue stores
    Category: Persistence
    Patterns: ['ProgramData/Microsoft/Network/Downloader/**', 'Documents and Settings/All Users/Application Data/Microsoft/Network/Downloader/**']
  - Id: windows.tasks
    Name: Scheduled task files
    Category: Persistence
    Patterns: ['Windows/System32/Tasks/**', 'Windows/Tasks/**']
  - Id: windows.startup
    Name: User and machine startup folders
    Category: Persistence
    Patterns: ['ProgramData/Microsoft/Windows/Start Menu/Programs/Startup/**']
    ProfilePatterns: ['AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/**', 'Start Menu/Programs/Startup/**']
  - Id: windows.gpo
    Name: Local Group Policy and locally present SYSVOL
    Category: Persistence
    Patterns: ['Windows/System32/GroupPolicy/**', 'Windows/System32/GroupPolicyUsers/**', 'Windows/SYSVOL/**', 'ProgramData/Microsoft/Group Policy/**']
    ProfilePatterns: ['AppData/Local/GroupPolicy/**']
  - Id: windows.wmi
    Name: WMI repository and related logs
    Category: Persistence
    Patterns: ['Windows/System32/wbem/Repository/**', 'Windows/System32/wbem/Logs/**']
  - Id: windows.defender
    Name: Original Defender history, logs and quarantine resources
    Category: SecurityProducts
    Patterns: ['ProgramData/Microsoft/Windows Defender/**', 'ProgramData/Microsoft/Windows Defender Advanced Threat Protection/**']
  - Id: windows.powershell
    Name: PowerShell and PowerShell Core histories
    Category: ProcessExecution
    ProfilePatterns: ['AppData/Roaming/Microsoft/Windows/PowerShell/**', 'AppData/Roaming/Microsoft/PowerShell/**']
  - Id: windows.browsers.chromium
    Name: Chromium profile stores including database companions
    Category: BrowserActivity
    ProfilePatterns: ['AppData/Local/Google/Chrome/User Data/**', 'AppData/Local/Microsoft/Edge/User Data/**', 'AppData/Local/BraveSoftware/Brave-Browser/User Data/**', 'AppData/Local/Vivaldi/User Data/**', 'AppData/Roaming/Opera Software/**']
  - Id: windows.browsers.firefox
    Name: Firefox profiles and settings
    Category: BrowserActivity
    ProfilePatterns: ['AppData/Roaming/Mozilla/Firefox/**', 'AppData/Local/Mozilla/Firefox/**']
  - Id: windows.browsers.webcache
    Name: Legacy WebCache and supporting files
    Category: BrowserActivity
    ProfilePatterns: ['AppData/Local/Microsoft/Windows/WebCache/**', 'AppData/Local/Microsoft/Windows/INetCache/**']
  - Id: windows.outlook
    Name: Classic and new Outlook local stores
    Category: Mail
    ProfilePatterns: ['AppData/Local/Microsoft/Outlook/**', 'Documents/Outlook Files/**', 'AppData/Local/Microsoft/Olk/**', 'AppData/Local/Packages/Microsoft.OutlookForWindows_*/**']
  - Id: windows.thunderbird
    Name: Thunderbird mail profiles
    Category: Mail
    ProfilePatterns: ['AppData/Roaming/Thunderbird/**']
  - Id: windows.search
    Name: Windows Search stores and recovery files
    Category: FileAndFolderOpening
    Patterns: ['ProgramData/Microsoft/Search/Data/**']
    ProfilePatterns: ['AppData/Local/Packages/Microsoft.Windows.Search_*/**']
  - Id: windows.notifications
    Name: Windows notification databases
    Category: ProcessExecution
    ProfilePatterns: ['AppData/Local/Microsoft/Windows/Notifications/**']
  - Id: windows.recycle
    Name: Recycle Bin metadata and content
    Category: FileSystem
    Patterns: ['$Recycle.Bin/**', 'RECYCLER/**', 'RECYCLED/**']
  - Id: windows.rdp
    Name: RDP client configuration and cache
    Category: Network
    ProfilePatterns: ['AppData/Local/Microsoft/Terminal Server Client/**', 'Documents/*.rdp']
  - Id: windows.ssh
    Name: SSH configuration and locally stored files
    Category: Network
    Patterns: ['ProgramData/ssh/**']
    ProfilePatterns: ['.ssh/**']
  - Id: windows.iis
    Name: IIS logs, configuration and web content
    Category: ServerRoles
    Patterns: ['inetpub/**', 'Windows/System32/inetsrv/config/**']
  - Id: windows.dc
    Name: Locally present AD database and recovery files
    Category: ServerRoles
    Patterns: ['Windows/NTDS/**']
  - Id: windows.dhcpdns
    Name: DHCP and DNS local server stores
    Category: ServerRoles
    Patterns: ['Windows/System32/dhcp/**', 'Windows/System32/dns/**']
  - Id: windows.sql
    Name: SQL log and configuration stores in standard installation paths
    Category: ServerRoles
    Patterns: ['Program Files/Microsoft SQL Server/**/Log/**', 'Program Files/Microsoft SQL Server/**/Binn/*.ini', 'Program Files (x86)/Microsoft SQL Server/**/Log/**']
  - Id: windows.hibernation
    Name: Hibernation file
    Category: Hibernation
    Patterns: ['hiberfil.sys']
    RawPaths: ['hiberfil.sys']
  - Id: windows.crashdumps
    Name: Existing Windows crash dumps and minidumps
    Category: CrashDumps
    Patterns: ['Windows/MEMORY.DMP', 'Windows/Minidump/**']
  - Id: windows.paging
    Name: Paging, swap, hibernation and existing memory dump files
    Category: Paging
    Patterns: ['pagefile.sys', 'swapfile.sys', 'hiberfil.sys', 'Windows/MEMORY.DMP', 'Windows/Minidump/**']
    RawPaths: ['pagefile.sys', 'swapfile.sys', 'hiberfil.sys']
  - Id: windows.logs
    Name: Windows diagnostic and setup logs
    Category: OperatingSystem
    Patterns: ['Windows/Logs/**', 'Windows/Panther/**', 'Windows/inf/setupapi*.log', 'Windows/debug/**', 'Windows/SoftwareDistribution/ReportingEvents.log']
  - Id: windows.network
    Name: Local network configuration stores
    Category: Network
    Patterns: ['ProgramData/Microsoft/Wlansvc/Profiles/**', 'ProgramData/Microsoft/Network/Connections/**', 'Windows/System32/drivers/etc/**', 'Windows/System32/LogFiles/Firewall/**']
  - Id: windows.intune
    Name: Intune local logs and management state
    Category: SecurityProducts
    Patterns: ['ProgramData/Microsoft/IntuneManagementExtension/**']
  - Id: windows.collaboration
    Name: Teams and common chat application local stores
    Category: Collaboration
    ProfilePatterns: ['AppData/Roaming/Microsoft/Teams/**', 'AppData/Local/Packages/MSTeams_*/**', 'AppData/Roaming/Slack/**', 'AppData/Roaming/discord/**']
  - Id: windows.developer
    Name: Developer and AI-assistant local state
    Category: ProcessExecution
    ProfilePatterns: ['.claude/**', '.codex/**', '.bash_history', '.python_history', '.gitconfig', 'AppData/Roaming/Code/User/History/**', 'AppData/Roaming/Code/logs/**']
